name: Build and Push Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE="ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest"
          echo "Building: $IMAGE"
          DOCKER_BUILDKIT=1 docker build \
            --cache-from "$IMAGE" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t "$IMAGE" \
            -f .swebench/Dockerfile .
          echo "Pushing: $IMAGE"
          docker push "$IMAGE"
