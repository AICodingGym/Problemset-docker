name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      INSTANCE_ID: "pydata__xarray-4687"
      REPO: "pydata/xarray"
      VERSION: "0.12"
      BASE_COMMIT: "d3b6aa6d8b997df115a53c001d00222a0f92f63a"
      ENV_SETUP_COMMIT: "1c198a191127c601d091213c4b3292a8bb3054e1"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'xarray/tests/test_computation.py xarray/tests/test_units.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Fetch code into /app
        run: |
          cd /app
          git config --global --add safe.directory /app
          git remote set-url origin https://github.com/${{ github.repository }}
          git fetch origin ${{ github.sha }} --depth=1
          git checkout ${{ github.sha }}

      - name: Generate and apply patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          cd /app
          git diff $BASE_COMMIT HEAD -- ':!.swebench' ':!.github' ':!.devcontainer' ':!.vscode' ':!submit.sh' ':!.gitignore' ':!problem_statement.md' ':!hints_text.md' ':!CLAUDE.md' ':!AGENTS.md' ':!.claudeignore' ':!.copilotignore' ':!.cursorignore' ':!.cursorrules' > /tmp/patch.diff || true
          echo "Patch size: $(wc -c < /tmp/patch.diff) bytes"
          git reset --hard $BASE_COMMIT
          git apply -v /tmp/patch.diff || echo "No code patch to apply"

      - name: Apply Test Patch
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/xarray/tests/test_computation.py b/xarray/tests/test_computation.py
          --- a/xarray/tests/test_computation.py
          +++ b/xarray/tests/test_computation.py
          @@ -1922,6 +1922,15 @@ def test_where() -> None:
               assert_identical(expected, actual)
           
           
          +def test_where_attrs() -> None:
          +    cond = xr.DataArray([True, False], dims="x", attrs={"attr": "cond"})
          +    x = xr.DataArray([1, 1], dims="x", attrs={"attr": "x"})
          +    y = xr.DataArray([0, 0], dims="x", attrs={"attr": "y"})
          +    actual = xr.where(cond, x, y, keep_attrs=True)
          +    expected = xr.DataArray([1, 0], dims="x", attrs={"attr": "x"})
          +    assert_identical(expected, actual)
          +
          +
           @pytest.mark.parametrize("use_dask", [True, False])
           @pytest.mark.parametrize("use_datetime", [True, False])
           def test_polyval(use_dask, use_datetime) -> None:
          diff --git a/xarray/tests/test_units.py b/xarray/tests/test_units.py
          --- a/xarray/tests/test_units.py
          +++ b/xarray/tests/test_units.py
          @@ -2429,10 +2429,7 @@ def test_binary_operations(self, func, dtype):
                   (
                       pytest.param(operator.lt, id="less_than"),
                       pytest.param(operator.ge, id="greater_equal"),
          -            pytest.param(
          -                operator.eq,
          -                id="equal",
          -            ),
          +            pytest.param(operator.eq, id="equal"),
                   ),
               )
               @pytest.mark.parametrize(
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          [
            "xarray/tests/test_computation.py::test_where_attrs"
