name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      INSTANCE_ID: "matplotlib__matplotlib-23299"
      REPO: "matplotlib/matplotlib"
      VERSION: "3.5"
      BASE_COMMIT: "3eadeacc06c9f2ddcdac6ae39819faa9fbee9e39"
      ENV_SETUP_COMMIT: "de98877e3dc45de8dd441d008f23d88738dc015d"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'lib/matplotlib/tests/test_rcparams.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Fetch code into /app
        run: |
          cd /app
          git config --global --add safe.directory /app
          git remote set-url origin https://github.com/${{ github.repository }}
          git fetch origin ${{ github.sha }} --depth=1
          git checkout ${{ github.sha }}

      - name: Generate and apply patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          cd /app
          git diff $BASE_COMMIT HEAD -- ':!.swebench' ':!.github' ':!.devcontainer' ':!.vscode' ':!submit.sh' ':!.gitignore' ':!problem_statement.md' ':!hints_text.md' ':!CLAUDE.md' ':!AGENTS.md' ':!.claudeignore' ':!.copilotignore' ':!.cursorignore' ':!.cursorrules' > /tmp/patch.diff || true
          echo "Patch size: $(wc -c < /tmp/patch.diff) bytes"
          git reset --hard $BASE_COMMIT
          git apply -v /tmp/patch.diff || echo "No code patch to apply"

      - name: Apply Test Patch
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/lib/matplotlib/tests/test_rcparams.py b/lib/matplotlib/tests/test_rcparams.py
          --- a/lib/matplotlib/tests/test_rcparams.py
          +++ b/lib/matplotlib/tests/test_rcparams.py
          @@ -496,6 +496,13 @@ def test_keymaps():
                   assert isinstance(mpl.rcParams[k], list)
           
           
          +def test_no_backend_reset_rccontext():
          +    assert mpl.rcParams['backend'] != 'module://aardvark'
          +    with mpl.rc_context():
          +        mpl.rcParams['backend'] = 'module://aardvark'
          +    assert mpl.rcParams['backend'] == 'module://aardvark'
          +
          +
           def test_rcparams_reset_after_fail():
               # There was previously a bug that meant that if rc_context failed and
               # raised an exception due to issues in the supplied rc parameters, the
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          [
            "lib/matplotlib/tests/test_rcparams.py::test_no_backend_reset_rccontext"
          ]
          FAIL_EOF
