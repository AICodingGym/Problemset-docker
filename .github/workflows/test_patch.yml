name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      INSTANCE_ID: "pylint-dev__pylint-7080"
      REPO: "pylint-dev/pylint"
      VERSION: "2.15"
      BASE_COMMIT: "3c5eca2ded3dd2b59ebaf23eb289453b5d2930f0"
      ENV_SETUP_COMMIT: "e90702074e68e20dc8e5df5013ee3ecf22139c3e"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'tests/test_self.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Fetch code into /app
        run: |
          cd /app
          git config --global --add safe.directory /app
          git remote set-url origin https://github.com/${{ github.repository }}
          git fetch origin ${{ github.sha }} --depth=1
          git checkout ${{ github.sha }}

      - name: Generate and apply patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          cd /app
          git diff $BASE_COMMIT HEAD -- ':!.swebench' ':!.github' ':!.devcontainer' ':!.vscode' ':!submit.sh' ':!.gitignore' ':!problem_statement.md' ':!hints_text.md' ':!CLAUDE.md' ':!AGENTS.md' ':!.claudeignore' ':!.copilotignore' ':!.cursorignore' ':!.cursorrules' > /tmp/patch.diff || true
          echo "Patch size: $(wc -c < /tmp/patch.diff) bytes"
          git reset --hard $BASE_COMMIT
          git apply -v /tmp/patch.diff || echo "No code patch to apply"

      - name: Apply Test Patch
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/tests/test_self.py b/tests/test_self.py
          --- a/tests/test_self.py
          +++ b/tests/test_self.py
          @@ -1330,6 +1330,27 @@ def test_recursive_current_dir(self):
                               code=0,
                           )
           
          +    def test_ignore_path_recursive_current_dir(self) -> None:
          +        """Tests that path is normalized before checked that is ignored. GitHub issue #6964"""
          +        with _test_sys_path():
          +            # pytest is including directory HERE/regrtest_data to sys.path which causes
          +            # astroid to believe that directory is a package.
          +            sys.path = [
          +                path
          +                for path in sys.path
          +                if not os.path.basename(path) == "regrtest_data"
          +            ]
          +            with _test_cwd():
          +                os.chdir(join(HERE, "regrtest_data", "directory"))
          +                self._runtest(
          +                    [
          +                        ".",
          +                        "--recursive=y",
          +                        "--ignore-paths=^ignored_subdirectory/.*",
          +                    ],
          +                    code=0,
          +                )
          +
               def test_regression_recursive_current_dir(self):
                   with _test_sys_path():
                       # pytest is including directory HERE/regrtest_data to sys.path which causes
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          [
            "tests/test_self.py::TestRunTC::test_ignore_path_recursive_current_dir"
          ]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
          [
            "tests/test_self.py::TestRunTC::test_pkginfo",
            "tests/test_self.py::TestRunTC::test_all",
            "tests/test_self.py::TestRunTC::test_no_ext_file",
            "tests/test_self.py::TestRunTC::test_w0704_ignored",
