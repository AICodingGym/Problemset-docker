name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      INSTANCE_ID: "matplotlib__matplotlib-20488"
      REPO: "matplotlib/matplotlib"
      VERSION: "3.4"
      BASE_COMMIT: "b7ce415c15eb39b026a097a2865da73fbcf15c9c"
      ENV_SETUP_COMMIT: "f93c0a3dcb82feed0262d758626c90d4002685f3"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'lib/matplotlib/tests/test_image.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Fetch code into /app
        run: |
          cd /app
          git config --global --add safe.directory /app
          git remote set-url origin https://github.com/${{ github.repository }}
          git fetch origin ${{ github.sha }} --depth=1
          git checkout ${{ github.sha }}

      - name: Generate and apply patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          cd /app
          git diff $BASE_COMMIT HEAD -- ':!.swebench' ':!.github' ':!.devcontainer' ':!.vscode' ':!submit.sh' ':!.gitignore' ':!problem_statement.md' ':!hints_text.md' ':!CLAUDE.md' ':!AGENTS.md' ':!.claudeignore' ':!.copilotignore' ':!.cursorignore' ':!.cursorrules' > /tmp/patch.diff || true
          echo "Patch size: $(wc -c < /tmp/patch.diff) bytes"
          git reset --hard $BASE_COMMIT
          git apply -v /tmp/patch.diff || echo "No code patch to apply"

      - name: Apply Test Patch
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/lib/matplotlib/tests/test_image.py b/lib/matplotlib/tests/test_image.py
          --- a/lib/matplotlib/tests/test_image.py
          +++ b/lib/matplotlib/tests/test_image.py
          @@ -1233,23 +1233,24 @@ def test_imshow_quantitynd():
               fig.canvas.draw()
           
           
          +@pytest.mark.parametrize('x', [-1, 1])
           @check_figures_equal(extensions=['png'])
          -def test_huge_range_log(fig_test, fig_ref):
          -    data = np.full((5, 5), -1, dtype=np.float64)
          +def test_huge_range_log(fig_test, fig_ref, x):
          +    # parametrize over bad lognorm -1 values and large range 1 -> 1e20
          +    data = np.full((5, 5), x, dtype=np.float64)
               data[0:2, :] = 1E20
           
               ax = fig_test.subplots()
          -    im = ax.imshow(data, norm=colors.LogNorm(vmin=100, vmax=data.max()),
          -                   interpolation='nearest', cmap='viridis')
          +    ax.imshow(data, norm=colors.LogNorm(vmin=1, vmax=data.max()),
          +              interpolation='nearest', cmap='viridis')
           
          -    data = np.full((5, 5), -1, dtype=np.float64)
          +    data = np.full((5, 5), x, dtype=np.float64)
               data[0:2, :] = 1000
           
          -    cmap = copy(plt.get_cmap('viridis'))
          -    cmap.set_under('w')
               ax = fig_ref.subplots()
          -    im = ax.imshow(data, norm=colors.Normalize(vmin=100, vmax=data.max()),
          -                   interpolation='nearest', cmap=cmap)
          +    cmap = plt.get_cmap('viridis').with_extremes(under='w')
          +    ax.imshow(data, norm=colors.Normalize(vmin=1, vmax=data.max()),
          +              interpolation='nearest', cmap=cmap)
           
           
           @check_figures_equal()
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          [
            "lib/matplotlib/tests/test_image.py::test_huge_range_log[png--1]"
          ]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
