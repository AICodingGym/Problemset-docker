name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      INSTANCE_ID: "pydata__xarray-4075"
      REPO: "pydata/xarray"
      VERSION: "0.12"
      BASE_COMMIT: "19b088636eb7d3f65ab7a1046ac672e0689371d8"
      ENV_SETUP_COMMIT: "1c198a191127c601d091213c4b3292a8bb3054e1"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'xarray/tests/test_weighted.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            build/
            **/*.so
          key: build-${{ hashFiles('**/*.pyx', '**/*.c', '**/*.h') }}
          restore-keys: build-

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/xarray/tests/test_weighted.py b/xarray/tests/test_weighted.py
          --- a/xarray/tests/test_weighted.py
          +++ b/xarray/tests/test_weighted.py
          @@ -59,6 +59,18 @@ def test_weighted_sum_of_weights_nan(weights, expected):
               assert_equal(expected, result)
           
           
          +def test_weighted_sum_of_weights_bool():
          +    # https://github.com/pydata/xarray/issues/4074
          +
          +    da = DataArray([1, 2])
          +    weights = DataArray([True, True])
          +    result = da.weighted(weights).sum_of_weights()
          +
          +    expected = DataArray(2)
          +
          +    assert_equal(expected, result)
          +
          +
           @pytest.mark.parametrize("da", ([1.0, 2], [1, np.nan], [np.nan, np.nan]))
           @pytest.mark.parametrize("factor", [0, 1, 3.14])
           @pytest.mark.parametrize("skipna", (True, False))
          @@ -158,6 +170,17 @@ def test_weighted_mean_nan(weights, expected, skipna):
               assert_equal(expected, result)
           
           
          +def test_weighted_mean_bool():
          +    # https://github.com/pydata/xarray/issues/4074
          +    da = DataArray([1, 1])
          +    weights = DataArray([True, True])
          +    expected = DataArray(1)
          +
          +    result = da.weighted(weights).mean()
          +
          +    assert_equal(expected, result)
          +
          +
           def expected_weighted(da, weights, dim, skipna, operation):
               """
               Generate expected result using ``*`` and ``sum``. This is checked against
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["xarray/tests/test_weighted.py::test_weighted_sum_of_weights_bool", "xarray/tests/test_weighted.py::test_weighted_mean_bool"]
          FAIL_EOF
