name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      INSTANCE_ID: "pydata__xarray-4695"
      REPO: "pydata/xarray"
      VERSION: "0.12"
      BASE_COMMIT: "51ef2a66c4e0896eab7d2b03e3dfb3963e338e3c"
      ENV_SETUP_COMMIT: "1c198a191127c601d091213c4b3292a8bb3054e1"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'xarray/tests/test_dataarray.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Fetch code into /app
        run: |
          cd /app
          git config --global --add safe.directory /app
          git remote set-url origin https://github.com/${{ github.repository }}
          git fetch origin ${{ github.sha }} --depth=1
          git checkout ${{ github.sha }}

      - name: Generate and apply patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          cd /app
          git diff $BASE_COMMIT HEAD -- ':!.swebench' ':!.github' ':!.devcontainer' ':!.vscode' ':!submit.sh' ':!.gitignore' ':!problem_statement.md' ':!hints_text.md' ':!CLAUDE.md' ':!AGENTS.md' ':!.claudeignore' ':!.copilotignore' ':!.cursorignore' ':!.cursorrules' > /tmp/patch.diff || true
          echo "Patch size: $(wc -c < /tmp/patch.diff) bytes"
          git reset --hard $BASE_COMMIT
          git apply -v /tmp/patch.diff || echo "No code patch to apply"

      - name: Apply Test Patch
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/xarray/tests/test_dataarray.py b/xarray/tests/test_dataarray.py
          --- a/xarray/tests/test_dataarray.py
          +++ b/xarray/tests/test_dataarray.py
          @@ -1170,6 +1170,16 @@ def test_loc_single_boolean(self):
                   assert data.loc[True] == 0
                   assert data.loc[False] == 1
           
          +    def test_loc_dim_name_collision_with_sel_params(self):
          +        da = xr.DataArray(
          +            [[0, 0], [1, 1]],
          +            dims=["dim1", "method"],
          +            coords={"dim1": ["x", "y"], "method": ["a", "b"]},
          +        )
          +        np.testing.assert_array_equal(
          +            da.loc[dict(dim1=["x", "y"], method=["a"])], [[0], [1]]
          +        )
          +
               def test_selection_multiindex(self):
                   mindex = pd.MultiIndex.from_product(
                       [["a", "b"], [1, 2], [-1, -2]], names=("one", "two", "three")
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["xarray/tests/test_dataarray.py::TestDataArray::test_loc_dim_name_collision_with_sel_params"]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
