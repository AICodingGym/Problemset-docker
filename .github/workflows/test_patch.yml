name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      INSTANCE_ID: "sympy__sympy-14248"
      REPO: "sympy/sympy"
      VERSION: "1.1"
      BASE_COMMIT: "9986b38181cdd556a3f3411e553864f11912244e"
      ENV_SETUP_COMMIT: "ec9e3c0436fbff934fa84e22bf07f1b3ef5bfac3"
      TEST_CMD: "PYTHONWARNINGS='ignore::UserWarning,ignore::SyntaxWarning' bin/test -C --verbose"
      TEST_FILES: "sympy/printing/pretty/tests/test_pretty.py sympy/printing/tests/test_ccode.py sympy/printing/tests/test_fcode.py sympy/printing/tests/test_jscode.py sympy/printing/tests/test_julia.py sympy/printing/tests/test_latex.py sympy/printing/tests/test_octave.py sympy/printing/tests/test_rcode.py sympy/printing/tests/test_str.py"
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup and run tests
        shell: bash
        run: |
          set +e
          git config --global --add safe.directory $GITHUB_WORKSPACE

          # Activate conda environment
          source /opt/conda/etc/profile.d/conda.sh
          conda activate testbed

          # Install repo in editable mode (fast — deps already cached in image)
          pip install -e . 2>/dev/null || python setup.py develop 2>/dev/null || true

          # Run FAIL_TO_PASS and PASS_TO_PASS tests
          if [ -f .swebench/run_script.sh ]; then
            chmod +x .swebench/run_script.sh
            bash .swebench/run_script.sh $TEST_FILES
            TEST_EXIT=$?
          else
            PYTHONWARNINGS='ignore::UserWarning,ignore::SyntaxWarning' bin/test -C --verbose $TEST_FILES
            TEST_EXIT=$?
          fi

          echo "TEST_EXIT=$TEST_EXIT" >> "$GITHUB_ENV"
          echo "test_exit=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          exit $TEST_EXIT
