name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      INSTANCE_ID: "pylint-dev__pylint-8898"
      REPO: "pylint-dev/pylint"
      VERSION: "3.0"
      BASE_COMMIT: "1f8c4d9eb185c16a2c1d881c054f015e1c2eb334"
      ENV_SETUP_COMMIT: "a0ce6e424e3a208f3aed1cbf6e16c40853bec3c0"
      TEST_CMD: "pytest -rA"
      TEST_FILES: "tests/config/test_config.py"
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup and run tests
        shell: bash
        run: |
          set +e
          git config --global --add safe.directory $GITHUB_WORKSPACE

          # Activate conda environment
          source /opt/conda/etc/profile.d/conda.sh
          conda activate testbed

          # Install repo in editable mode (fast — deps already cached in image)
          pip install -e . 2>/dev/null || python setup.py develop 2>/dev/null || true

          # Run FAIL_TO_PASS and PASS_TO_PASS tests
          if [ -f .swebench/run_script.sh ]; then
            chmod +x .swebench/run_script.sh
            bash .swebench/run_script.sh $TEST_FILES
            TEST_EXIT=$?
          else
            pytest -rA $TEST_FILES
            TEST_EXIT=$?
          fi

          echo "TEST_EXIT=$TEST_EXIT" >> "$GITHUB_ENV"
          echo "test_exit=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          exit $TEST_EXIT
