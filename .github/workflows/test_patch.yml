name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      INSTANCE_ID: "pydata__xarray-6721"
      REPO: "pydata/xarray"
      VERSION: "2022.06"
      BASE_COMMIT: "cc183652bf6e1273e985e1c4b3cba79c896c1193"
      ENV_SETUP_COMMIT: "50ea159bfd0872635ebf4281e741f3c87f0bef6b"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'xarray/tests/test_dataset.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Fetch code into /app
        run: |
          cd /app
          git config --global --add safe.directory /app
          git remote set-url origin https://github.com/${{ github.repository }}
          git fetch origin ${{ github.sha }} --depth=1
          git checkout ${{ github.sha }}

      - name: Generate and apply patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          cd /app
          git diff $BASE_COMMIT HEAD -- ':!.swebench' ':!.github' ':!.devcontainer' ':!.vscode' ':!submit.sh' ':!.gitignore' ':!problem_statement.md' ':!hints_text.md' ':!CLAUDE.md' ':!AGENTS.md' ':!.claudeignore' ':!.copilotignore' ':!.cursorignore' ':!.cursorrules' > /tmp/patch.diff || true
          echo "Patch size: $(wc -c < /tmp/patch.diff) bytes"
          git reset --hard $BASE_COMMIT
          git apply -v /tmp/patch.diff || echo "No code patch to apply"

      - name: Apply Test Patch
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/xarray/tests/test_dataset.py b/xarray/tests/test_dataset.py
          --- a/xarray/tests/test_dataset.py
          +++ b/xarray/tests/test_dataset.py
          @@ -992,6 +992,13 @@ def test_attrs(self) -> None:
                   assert data.attrs["foobar"], "baz"
                   assert isinstance(data.attrs, dict)
           
          +    def test_chunks_does_not_load_data(self) -> None:
          +        # regression test for GH6538
          +        store = InaccessibleVariableDataStore()
          +        create_test_data().dump_to_store(store)
          +        ds = open_dataset(store)
          +        assert ds.chunks == {}
          +
               @requires_dask
               def test_chunk(self) -> None:
                   data = create_test_data()
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          [
            "xarray/tests/test_dataset.py::TestDataset::test_chunks_does_not_load_data"
          ]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
          [
            "xarray/tests/test_dataset.py::TestDataset::test_repr",
            "xarray/tests/test_dataset.py::TestDataset::test_repr_multiindex",
