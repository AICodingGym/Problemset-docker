name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      INSTANCE_ID: "pydata__xarray-6744"
      REPO: "pydata/xarray"
      VERSION: "2022.06"
      BASE_COMMIT: "7cc6cc991e586a6158bb656b8001234ccda25407"
      ENV_SETUP_COMMIT: "50ea159bfd0872635ebf4281e741f3c87f0bef6b"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'xarray/tests/test_rolling.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Fetch code into /app
        run: |
          cd /app
          git config --global --add safe.directory /app
          git remote set-url origin https://github.com/${{ github.repository }}
          git fetch origin ${{ github.sha }} --depth=1
          git checkout ${{ github.sha }}

      - name: Generate and apply patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          cd /app
          git diff $BASE_COMMIT HEAD -- ':!.swebench' ':!.github' ':!.devcontainer' ':!.vscode' ':!submit.sh' ':!.gitignore' ':!problem_statement.md' ':!hints_text.md' ':!CLAUDE.md' ':!AGENTS.md' ':!.claudeignore' ':!.copilotignore' ':!.cursorignore' ':!.cursorrules' > /tmp/patch.diff || true
          echo "Patch size: $(wc -c < /tmp/patch.diff) bytes"
          git reset --hard $BASE_COMMIT
          git apply -v /tmp/patch.diff || echo "No code patch to apply"

      - name: Apply Test Patch
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/xarray/tests/test_rolling.py b/xarray/tests/test_rolling.py
          --- a/xarray/tests/test_rolling.py
          +++ b/xarray/tests/test_rolling.py
          @@ -27,8 +27,10 @@
           
           class TestDataArrayRolling:
               @pytest.mark.parametrize("da", (1, 2), indirect=True)
          -    def test_rolling_iter(self, da) -> None:
          -        rolling_obj = da.rolling(time=7)
          +    @pytest.mark.parametrize("center", [True, False])
          +    @pytest.mark.parametrize("size", [1, 2, 3, 7])
          +    def test_rolling_iter(self, da: DataArray, center: bool, size: int) -> None:
          +        rolling_obj = da.rolling(time=size, center=center)
                   rolling_obj_mean = rolling_obj.mean()
           
                   assert len(rolling_obj.window_labels) == len(da["time"])
          @@ -40,14 +42,7 @@ def test_rolling_iter(self, da) -> None:
                       actual = rolling_obj_mean.isel(time=i)
                       expected = window_da.mean("time")
           
          -            # TODO add assert_allclose_with_nan, which compares nan position
          -            # as well as the closeness of the values.
          -            assert_array_equal(actual.isnull(), expected.isnull())
          -            if (~actual.isnull()).sum() > 0:
          -                np.allclose(
          -                    actual.values[actual.values.nonzero()],
          -                    expected.values[expected.values.nonzero()],
          -                )
          +            np.testing.assert_allclose(actual.values, expected.values)
           
               @pytest.mark.parametrize("da", (1,), indirect=True)
               def test_rolling_repr(self, da) -> None:
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
