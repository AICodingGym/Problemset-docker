name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      INSTANCE_ID: "matplotlib__matplotlib-26342"
      REPO: "matplotlib/matplotlib"
      VERSION: "3.7"
      BASE_COMMIT: "2aee6ccd7c7e1f8d282c1e7579f4ee546b838542"
      ENV_SETUP_COMMIT: "0849036fd992a2dd133a0cffc3f84f58ccf1840f"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'lib/matplotlib/tests/test_contour.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            build/
            **/*.so
          key: build-${{ hashFiles('**/*.pyx', '**/*.c', '**/*.h') }}
          restore-keys: build-

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          sudo apt-get -y update && sudo apt-get -y upgrade && DEBIAN_FRONTEND=noninteractive sudo apt-get install -y imagemagick ffmpeg texlive texlive-latex-extra texlive-fonts-recommended texlive-xetex texlive-luatex cm-super dvipng
          QHULL_URL="http://www.qhull.org/download/qhull-2020-src-8.0.2.tgz"
          QHULL_TAR="/tmp/qhull-2020-src-8.0.2.tgz"
          QHULL_BUILD_DIR="$GITHUB_WORKSPACE/build"
          wget -O "$QHULL_TAR" "$QHULL_URL"
          mkdir -p "$QHULL_BUILD_DIR"
          tar -xvzf "$QHULL_TAR" -C "$QHULL_BUILD_DIR"
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/lib/matplotlib/tests/test_contour.py b/lib/matplotlib/tests/test_contour.py
          --- a/lib/matplotlib/tests/test_contour.py
          +++ b/lib/matplotlib/tests/test_contour.py
          @@ -11,7 +11,7 @@
           from matplotlib import pyplot as plt, rc_context, ticker
           from matplotlib.colors import LogNorm, same_color
           import matplotlib.patches as mpatches
          -from matplotlib.testing.decorators import image_comparison
          +from matplotlib.testing.decorators import check_figures_equal, image_comparison
           import pytest
           
           
          @@ -100,6 +100,14 @@ def test_contour_Nlevels():
               assert (cs1.levels == cs2.levels).all()
           
           
          +@check_figures_equal(extensions=['png'])
          +def test_contour_set_paths(fig_test, fig_ref):
          +    cs_test = fig_test.subplots().contour([[0, 1], [1, 2]])
          +    cs_ref = fig_ref.subplots().contour([[1, 0], [2, 1]])
          +
          +    cs_test.set_paths(cs_ref.get_paths())
          +
          +
           @pytest.mark.parametrize("split_collections", [False, True])
           @image_comparison(['contour_manual_labels'], remove_text=True, style='mpl20', tol=0.26)
           def test_contour_manual_labels(split_collections):
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          [
            "lib/matplotlib/tests/test_contour.py::test_contour_set_paths[png]"
          ]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
          [
            "lib/matplotlib/tests/test_contour.py::test_contour_shape_1d_valid",
            "lib/matplotlib/tests/test_contour.py::test_contour_shape_2d_valid",
            "lib/matplotlib/tests/test_contour.py::test_contour_shape_error[args0-Length",
            "lib/matplotlib/tests/test_contour.py::test_contour_shape_error[args1-Length",
            "lib/matplotlib/tests/test_contour.py::test_contour_shape_error[args2-Number",
            "lib/matplotlib/tests/test_contour.py::test_contour_shape_error[args3-Number",
            "lib/matplotlib/tests/test_contour.py::test_contour_shape_error[args4-Shapes",
            "lib/matplotlib/tests/test_contour.py::test_contour_shape_error[args5-Shapes",
            "lib/matplotlib/tests/test_contour.py::test_contour_shape_error[args6-Inputs",
            "lib/matplotlib/tests/test_contour.py::test_contour_shape_error[args7-Input",
            "lib/matplotlib/tests/test_contour.py::test_contour_shape_error[args8-Input",
            "lib/matplotlib/tests/test_contour.py::test_contour_shape_error[args9-Input",
            "lib/matplotlib/tests/test_contour.py::test_contour_no_valid_levels",
            "lib/matplotlib/tests/test_contour.py::test_contour_Nlevels",
            "lib/matplotlib/tests/test_contour.py::test_contour_manual_labels[png-False]",
            "lib/matplotlib/tests/test_contour.py::test_contour_manual_labels[png-True]",
            "lib/matplotlib/tests/test_contour.py::test_contour_manual_labels[pdf-False]",
            "lib/matplotlib/tests/test_contour.py::test_contour_manual_labels[pdf-True]",
            "lib/matplotlib/tests/test_contour.py::test_given_colors_levels_and_extends[png-False]",
            "lib/matplotlib/tests/test_contour.py::test_given_colors_levels_and_extends[png-True]",
            "lib/matplotlib/tests/test_contour.py::test_contour_datetime_axis[png-False]",
            "lib/matplotlib/tests/test_contour.py::test_contour_datetime_axis[png-True]",
