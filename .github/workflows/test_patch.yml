name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      INSTANCE_ID: "matplotlib__matplotlib-25775"
      REPO: "matplotlib/matplotlib"
      VERSION: "3.7"
      BASE_COMMIT: "26224d96066b5c60882296c551f54ca7732c0af0"
      ENV_SETUP_COMMIT: "0849036fd992a2dd133a0cffc3f84f58ccf1840f"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'lib/matplotlib/tests/test_text.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Fetch code into /app
        run: |
          cd /app
          git config --global --add safe.directory /app
          git remote set-url origin https://github.com/${{ github.repository }}
          git fetch origin ${{ github.sha }} --depth=1
          git checkout ${{ github.sha }}

      - name: Generate and apply patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          cd /app
          git diff $BASE_COMMIT HEAD -- ':!.swebench' ':!.github' ':!.devcontainer' ':!.vscode' ':!submit.sh' ':!.gitignore' ':!problem_statement.md' ':!hints_text.md' ':!CLAUDE.md' ':!AGENTS.md' ':!.claudeignore' ':!.copilotignore' ':!.cursorignore' ':!.cursorrules' > /tmp/patch.diff || true
          echo "Patch size: $(wc -c < /tmp/patch.diff) bytes"
          git reset --hard $BASE_COMMIT
          git apply -v /tmp/patch.diff || echo "No code patch to apply"

      - name: Apply Test Patch
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/lib/matplotlib/tests/test_text.py b/lib/matplotlib/tests/test_text.py
          --- a/lib/matplotlib/tests/test_text.py
          +++ b/lib/matplotlib/tests/test_text.py
          @@ -14,7 +14,7 @@
           import matplotlib.transforms as mtransforms
           from matplotlib.testing.decorators import check_figures_equal, image_comparison
           from matplotlib.testing._markers import needs_usetex
          -from matplotlib.text import Text
          +from matplotlib.text import Text, Annotation
           
           
           @image_comparison(['font_styles'])
          @@ -902,3 +902,63 @@ def test_annotate_offset_fontsize():
               points_coords, fontsize_coords = [ann.get_window_extent() for ann in anns]
               fig.canvas.draw()
               assert str(points_coords) == str(fontsize_coords)
          +
          +
          +def test_set_antialiased():
          +    txt = Text(.5, .5, "foo\nbar")
          +    assert txt._antialiased == mpl.rcParams['text.antialiased']
          +
          +    txt.set_antialiased(True)
          +    assert txt._antialiased is True
          +
          +    txt.set_antialiased(False)
          +    assert txt._antialiased is False
          +
          +
          +def test_get_antialiased():
          +
          +    txt2 = Text(.5, .5, "foo\nbar", antialiased=True)
          +    assert txt2._antialiased is True
          +    assert txt2.get_antialiased() == txt2._antialiased
          +
          +    txt3 = Text(.5, .5, "foo\nbar", antialiased=False)
          +    assert txt3._antialiased is False
          +    assert txt3.get_antialiased() == txt3._antialiased
          +
          +    txt4 = Text(.5, .5, "foo\nbar")
          +    assert txt4.get_antialiased() == mpl.rcParams['text.antialiased']
          +
          +
          +def test_annotation_antialiased():
          +    annot = Annotation("foo\nbar", (.5, .5), antialiased=True)
          +    assert annot._antialiased is True
          +    assert annot.get_antialiased() == annot._antialiased
          +
          +    annot2 = Annotation("foo\nbar", (.5, .5), antialiased=False)
          +    assert annot2._antialiased is False
          +    assert annot2.get_antialiased() == annot2._antialiased
          +
          +    annot3 = Annotation("foo\nbar", (.5, .5), antialiased=False)
          +    annot3.set_antialiased(True)
          +    assert annot3.get_antialiased() is True
          +    assert annot3._antialiased is True
          +
          +    annot4 = Annotation("foo\nbar", (.5, .5))
          +    assert annot4._antialiased == mpl.rcParams['text.antialiased']
          +
          +
          +@check_figures_equal()
          +def test_text_antialiased_off_default_vs_manual(fig_test, fig_ref):
          +    fig_test.text(0.5, 0.5, '6 inches x 2 inches',
          +                             antialiased=False)
          +
          +    mpl.rcParams['text.antialiased'] = False
          +    fig_ref.text(0.5, 0.5, '6 inches x 2 inches')
          +
          +
          +@check_figures_equal()
          +def test_text_antialiased_on_default_vs_manual(fig_test, fig_ref):
          +    fig_test.text(0.5, 0.5, '6 inches x 2 inches', antialiased=True)
          +
          +    mpl.rcParams['text.antialiased'] = True
          +    fig_ref.text(0.5, 0.5, '6 inches x 2 inches')
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          [
            "lib/matplotlib/tests/test_text.py::test_set_antialiased",
            "lib/matplotlib/tests/test_text.py::test_get_antialiased",
            "lib/matplotlib/tests/test_text.py::test_annotation_antialiased",
            "lib/matplotlib/tests/test_text.py::test_text_antialiased_off_default_vs_manual[png]",
            "lib/matplotlib/tests/test_text.py::test_text_antialiased_off_default_vs_manual[pdf]",
            "lib/matplotlib/tests/test_text.py::test_text_antialiased_on_default_vs_manual[png]",
            "lib/matplotlib/tests/test_text.py::test_text_antialiased_on_default_vs_manual[pdf]"
          ]
