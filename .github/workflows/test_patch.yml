name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      INSTANCE_ID: "pydata__xarray-3993"
      REPO: "pydata/xarray"
      VERSION: "0.12"
      BASE_COMMIT: "8cc34cb412ba89ebca12fc84f76a9e452628f1bc"
      ENV_SETUP_COMMIT: "1c198a191127c601d091213c4b3292a8bb3054e1"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'xarray/tests/test_dataset.py xarray/tests/test_units.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            build/
            **/*.so
          key: build-${{ hashFiles('**/*.pyx', '**/*.c', '**/*.h') }}
          restore-keys: build-

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/xarray/tests/test_dataset.py b/xarray/tests/test_dataset.py
          --- a/xarray/tests/test_dataset.py
          +++ b/xarray/tests/test_dataset.py
          @@ -6603,6 +6603,9 @@ def test_integrate(dask):
               with pytest.raises(ValueError):
                   da.integrate("x2d")
           
          +    with pytest.warns(FutureWarning):
          +        da.integrate(dim="x")
          +
           
           @pytest.mark.parametrize("dask", [True, False])
           @pytest.mark.parametrize("which_datetime", ["np", "cftime"])
          diff --git a/xarray/tests/test_units.py b/xarray/tests/test_units.py
          --- a/xarray/tests/test_units.py
          +++ b/xarray/tests/test_units.py
          @@ -3681,7 +3681,7 @@ def test_stacking_reordering(self, func, dtype):
                   (
                       method("diff", dim="x"),
                       method("differentiate", coord="x"),
          -            method("integrate", dim="x"),
          +            method("integrate", coord="x"),
                       method("quantile", q=[0.25, 0.75]),
                       method("reduce", func=np.sum, dim="x"),
                       pytest.param(lambda x: x.dot(x), id="method_dot"),
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          [
            "xarray/tests/test_dataset.py::test_integrate[True]",
            "xarray/tests/test_dataset.py::test_integrate[False]"
          ]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
