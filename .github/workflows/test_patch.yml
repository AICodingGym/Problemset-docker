name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      INSTANCE_ID: "pydata__xarray-6461"
      REPO: "pydata/xarray"
      VERSION: "2022.03"
      BASE_COMMIT: "851dadeb0338403e5021c3fbe80cbc9127ee672d"
      ENV_SETUP_COMMIT: "d7931f9014a26e712ff5f30c4082cf0261f045d3"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'xarray/tests/test_computation.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            build/
            **/*.so
          key: build-${{ hashFiles('**/*.pyx', '**/*.c', '**/*.h') }}
          restore-keys: build-

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/xarray/tests/test_computation.py b/xarray/tests/test_computation.py
          --- a/xarray/tests/test_computation.py
          +++ b/xarray/tests/test_computation.py
          @@ -1928,6 +1928,10 @@ def test_where_attrs() -> None:
               expected = xr.DataArray([1, 0], dims="x", attrs={"attr": "x"})
               assert_identical(expected, actual)
           
          +    # ensure keep_attrs can handle scalar values
          +    actual = xr.where(cond, 1, 0, keep_attrs=True)
          +    assert actual.attrs == {}
          +
           
           @pytest.mark.parametrize("use_dask", [True, False])
           @pytest.mark.parametrize("use_datetime", [True, False])
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["xarray/tests/test_computation.py::test_where_attrs"]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
          ["xarray/tests/test_computation.py::test_signature_properties", "xarray/tests/test_computation.py::test_result_name", "xarray/tests/test_computation.py::test_ordered_set_union", "xarray/tests/test_computation.py::test_ordered_set_intersection", "xarray/tests/test_computation.py::test_join_dict_keys", "xarray/tests/test_computation.py::test_collect_dict_values", "xarray/tests/test_computation.py::test_apply_identity", "xarray/tests/test_computation.py::test_apply_two_inputs", "xarray/tests/test_computation.py::test_apply_1d_and_0d", "xarray/tests/test_computation.py::test_apply_two_outputs", "xarray/tests/test_computation.py::test_apply_dask_parallelized_two_outputs", "xarray/tests/test_computation.py::test_apply_input_core_dimension", "xarray/tests/test_computation.py::test_apply_output_core_dimension", "xarray/tests/test_computation.py::test_apply_exclude", "xarray/tests/test_computation.py::test_apply_groupby_add", "xarray/tests/test_computation.py::test_unified_dim_sizes", "xarray/tests/test_computation.py::test_broadcast_compat_data_1d", "xarray/tests/test_computation.py::test_broadcast_compat_data_2d", "xarray/tests/test_computation.py::test_keep_attrs", "xarray/tests/test_computation.py::test_keep_attrs_strategies_variable[default]", "xarray/tests/test_computation.py::test_keep_attrs_strategies_variable[False]", "xarray/tests/test_computation.py::test_keep_attrs_strategies_variable[True]", "xarray/tests/test_computation.py::test_keep_attrs_strategies_variable[override]", "xarray/tests/test_computation.py::test_keep_attrs_strategies_variable[drop]", "xarray/tests/test_computation.py::test_keep_attrs_strategies_variable[drop_conflicts]", "xarray/tests/test_computation.py::test_keep_attrs_strategies_variable[no_conflicts]", "xarray/tests/test_computation.py::test_keep_attrs_strategies_dataarray[default]", "xarray/tests/test_computation.py::test_keep_attrs_strategies_dataarray[False]", "xarray/tests/test_computation.py::test_keep_attrs_strategies_dataarr