name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      INSTANCE_ID: "matplotlib__matplotlib-25122"
      REPO: "matplotlib/matplotlib"
      VERSION: "3.6"
      BASE_COMMIT: "5ec2bd279729ff534719b8bf238dbbca907b93c5"
      ENV_SETUP_COMMIT: "73909bcb408886a22e2b84581d6b9e6d9907c813"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'lib/matplotlib/tests/test_mlab.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            build/
            **/*.so
          key: build-${{ hashFiles('**/*.pyx', '**/*.c', '**/*.h') }}
          restore-keys: build-

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          sudo apt-get -y update && sudo apt-get -y upgrade && DEBIAN_FRONTEND=noninteractive sudo apt-get install -y imagemagick ffmpeg texlive texlive-latex-extra texlive-fonts-recommended texlive-xetex texlive-luatex cm-super dvipng
          QHULL_URL="http://www.qhull.org/download/qhull-2020-src-8.0.2.tgz"
          QHULL_TAR="/tmp/qhull-2020-src-8.0.2.tgz"
          QHULL_BUILD_DIR="$GITHUB_WORKSPACE/build"
          wget -O "$QHULL_TAR" "$QHULL_URL"
          mkdir -p "$QHULL_BUILD_DIR"
          tar -xvzf "$QHULL_TAR" -C "$QHULL_BUILD_DIR"
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/lib/matplotlib/tests/test_mlab.py b/lib/matplotlib/tests/test_mlab.py
          --- a/lib/matplotlib/tests/test_mlab.py
          +++ b/lib/matplotlib/tests/test_mlab.py
          @@ -615,7 +615,7 @@ def test_psd_window_hanning(self):
                                            noverlap=0,
                                            sides=self.sides,
                                            window=mlab.window_none)
          -        spec_c *= len(ycontrol1)/(np.abs(windowVals)**2).sum()
          +        spec_c *= len(ycontrol1)/(windowVals**2).sum()
                   assert_array_equal(fsp_g, fsp_c)
                   assert_array_equal(fsp_b, fsp_c)
                   assert_allclose(spec_g, spec_c, atol=1e-08)
          @@ -662,7 +662,7 @@ def test_psd_window_hanning_detrend_linear(self):
                                            noverlap=0,
                                            sides=self.sides,
                                            window=mlab.window_none)
          -        spec_c *= len(ycontrol1)/(np.abs(windowVals)**2).sum()
          +        spec_c *= len(ycontrol1)/(windowVals**2).sum()
                   assert_array_equal(fsp_g, fsp_c)
                   assert_array_equal(fsp_b, fsp_c)
                   assert_allclose(spec_g, spec_c, atol=1e-08)
          @@ -670,6 +670,33 @@ def test_psd_window_hanning_detrend_linear(self):
                   with pytest.raises(AssertionError):
                       assert_allclose(spec_b, spec_c, atol=1e-08)
           
          +    def test_psd_window_flattop(self):
          +        # flattop window
          +        # adaption from https://github.com/scipy/scipy/blob\
          +        # /v1.10.0/scipy/signal/windows/_windows.py#L562-L622
          +        a = [0.21557895, 0.41663158, 0.277263158, 0.083578947, 0.006947368]
          +        fac = np.linspace(-np.pi, np.pi, self.NFFT_density_real)
          +        win = np.zeros(self.NFFT_density_real)
          +        for k in range(len(a)):
          +            win += a[k] * np.cos(k * fac)
          +
          +        spec, fsp = mlab.psd(x=self.y,
          +                             NFFT=self.NFFT_density,
          +                             Fs=self.Fs,
          +                             noverlap=0,
          +                             sides=self.sides,
          +                             window=win,
          +                             scale_by_freq=False)
          +        spec_a, fsp_a = mlab.psd(x=self.y,
          +                                 NFFT=self.NFFT_density,
          +                                 Fs=self.Fs,
          +                                 noverlap=0,
          +                                 sides=self.sides,
          +                                 window=win)
          +        assert_allclose(spec*win.sum()**2,
          +                        spec_a*self.Fs*(win**2).sum(),
          +                        atol=1e-08)
          +
               def test_psd_windowarray(self):
                   freqs = self.freqs_density
                   spec, fsp = mlab.psd(x=self.y,
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
