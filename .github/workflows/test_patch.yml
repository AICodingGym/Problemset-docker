name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      INSTANCE_ID: "pydata__xarray-6938"
      REPO: "pydata/xarray"
      VERSION: "2022.06"
      BASE_COMMIT: "c4e40d991c28be51de9ac560ce895ac7f9b14924"
      ENV_SETUP_COMMIT: "50ea159bfd0872635ebf4281e741f3c87f0bef6b"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'xarray/tests/test_variable.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Fetch code into /app
        run: |
          cd /app
          git config --global --add safe.directory /app
          git remote set-url origin https://github.com/${{ github.repository }}
          git fetch origin ${{ github.sha }} --depth=1
          git checkout ${{ github.sha }}

      - name: Generate and apply patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          cd /app
          git diff $BASE_COMMIT HEAD -- ':!.swebench' ':!.github' ':!.devcontainer' ':!.vscode' ':!submit.sh' ':!.gitignore' ':!problem_statement.md' ':!hints_text.md' ':!CLAUDE.md' ':!AGENTS.md' ':!.claudeignore' ':!.copilotignore' ':!.cursorignore' ':!.cursorrules' > /tmp/patch.diff || true
          echo "Patch size: $(wc -c < /tmp/patch.diff) bytes"
          git reset --hard $BASE_COMMIT
          git apply -v /tmp/patch.diff || echo "No code patch to apply"

      - name: Apply Test Patch
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/xarray/tests/test_variable.py b/xarray/tests/test_variable.py
          --- a/xarray/tests/test_variable.py
          +++ b/xarray/tests/test_variable.py
          @@ -2422,6 +2422,15 @@ def test_rolling_window_errors(self):
               def test_coarsen_2d(self):
                   super().test_coarsen_2d()
           
          +    def test_to_index_variable_copy(self) -> None:
          +        # to_index_variable should return a copy
          +        # https://github.com/pydata/xarray/issues/6931
          +        a = IndexVariable("x", ["a"])
          +        b = a.to_index_variable()
          +        assert a is not b
          +        b.dims = ("y",)
          +        assert a.dims == ("x",)
          +
           
           class TestAsCompatibleData:
               def test_unchanged_types(self):
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["xarray/tests/test_variable.py::TestIndexVariable::test_to_index_variable_copy"]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
          ["xarray/tests/test_variable.py::TestVariable::test_properties", "xarray/tests/test_variable.py::TestVariable::test_attrs", "xarray/tests/test_variable.py::TestVariable::test_getitem_dict", "xarray/tests/test_variable.py::TestVariable::test_getitem_1d", "xarray/tests/test_variable.py::TestVariable::test_getitem_1d_fancy", "xarray/tests/test_variable.py::TestVariable::test_getitem_with_mask", "xarray/tests/test_variable.py::TestVariable::test_getitem_with_mask_size_zero", "xarray/tests/test_variable.py::TestVariable::test_getitem_with_mask_nd_indexer", "xarray/tests/test_variable.py::TestVariable::test_index_0d_int", "xarray/tests/test_variable.py::TestVariable::test_index_0d_float", "xarray/tests/test_variable.py::TestVariable::test_index_0d_string", "xarray/tests/test_variable.py::TestVariable::test_index_0d_datetime", "xarray/tests/test_variable.py::TestVariable::test_index_0d_timedelta64", "xarray/tests/test_variable.py::TestVariable::test_index_0d_not_a_time", "xarray/tests/test_variable.py::TestVariable::test_index_0d_object", "xarray/tests/test_variable.py::TestVariable::test_0d_object_array_with_list", "xarray/tests/test_variable.py::TestVariable::test_index_and_concat_datetime", "xarray/tests/test_variable.py::TestVariable::test_0d_time_data", "xarray/tests/test_variable.py::TestVariable::test_datetime64_conversion", "xarray/tests/test_variable.py::TestVariable::test_timedelta64_conversion", "xarray/tests/test_variable.py::TestVariable::test_object_conversion", "xarray/tests/test_variable.py::TestVariable::test_datetime64_valid_range", "xarray/tests/test_variable.py::TestVariable::test_pandas_data", "xarray/tests/test_variable.py::TestVariable::test_pandas_period_index", "xarray/tests/test_variable.py::TestVariable::test_1d_math", "xarray/tests/test_variable.py::TestVariable::test_1d_reduce", "xarray/tests/test_variable.py::TestVariable::test_array_interface", "xarray/tests/test_variable.py::TestVariable::test___array__", "xarray/tests/test_variabl