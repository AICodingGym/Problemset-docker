name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      INSTANCE_ID: "pytest-dev__pytest-7982"
      REPO: "pytest-dev/pytest"
      VERSION: "6.2"
      BASE_COMMIT: "a7e38c5c61928033a2dc1915cbee8caa8544a4d0"
      ENV_SETUP_COMMIT: "902739cfc3bbc3379e6ef99c8e250de35f52ecde"
      TEST_CMD: "pytest -rA"
      TEST_FILES: "testing/test_collection.py"
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup and run tests
        shell: bash
        run: |
          set +e
          git config --global --add safe.directory $GITHUB_WORKSPACE

          # Activate conda environment
          source /opt/conda/etc/profile.d/conda.sh
          conda activate testbed

          # Install repo in editable mode (fast — deps already cached in image)
          pip install -e . 2>/dev/null || python setup.py develop 2>/dev/null || true

          # Run FAIL_TO_PASS and PASS_TO_PASS tests
          if [ -f .swebench/run_script.sh ]; then
            chmod +x .swebench/run_script.sh
            bash .swebench/run_script.sh $TEST_FILES
            TEST_EXIT=$?
          else
            pytest -rA $TEST_FILES
            TEST_EXIT=$?
          fi

          echo "TEST_EXIT=$TEST_EXIT" >> "$GITHUB_ENV"
          echo "test_exit=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          exit $TEST_EXIT
