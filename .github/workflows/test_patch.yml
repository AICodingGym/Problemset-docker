name: SWE-bench Pro Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      INSTANCE_ID: "instance_tutao__tutanota-40e94dee2bcec2b63f362da283123e9df1874cc1-vc4e41fd0029957297843cb9dec4a25c7c756f029"
      REPO: "tutao/tutanota"
      BASE_COMMIT: "a74f4b8d6f357e1ef0f22b00a244c8a3d9272304"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          mkdir -p /workspace
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git fetch origin $BASE_COMMIT --depth=1 || true
          git diff $BASE_COMMIT HEAD -- ':!.swebench' ':!.github' ':!.devcontainer' ':!.vscode' ':!submit.sh' ':!.gitignore' ':!problem_statement.md' ':!hints_text.md' ':!CLAUDE.md' ':!AGENTS.md' ':!.claudeignore' ':!.copilotignore' ':!.cursorignore' ':!.cursorrules' > /workspace/patch.diff || true
          echo "Patch size: $(wc -c < /workspace/patch.diff) bytes"
          cp .swebench/run_script.sh /workspace/run_script.sh
          cp .swebench/parser.py /workspace/parser.py
          cp .swebench/entrypoint.sh /workspace/entrypoint.sh
          chmod +x /workspace/run_script.sh /workspace/entrypoint.sh

      - name: Run tests
        id: run_tests
        run: |
          set +e
          /workspace/entrypoint.sh
          TEST_EXIT=$?
          echo "TEST_EXIT=$TEST_EXIT" >> "$GITHUB_ENV"
          echo "test_exit=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          exit $TEST_EXIT
