name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      INSTANCE_ID: "pydata__xarray-4356"
      REPO: "pydata/xarray"
      VERSION: "0.12"
      BASE_COMMIT: "e05fddea852d08fc0845f954b79deb9e9f9ff883"
      ENV_SETUP_COMMIT: "1c198a191127c601d091213c4b3292a8bb3054e1"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'xarray/tests/test_duck_array_ops.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Fetch code into /app
        run: |
          cd /app
          git config --global --add safe.directory /app
          git remote set-url origin https://github.com/${{ github.repository }}
          git fetch origin ${{ github.sha }} --depth=1
          git checkout ${{ github.sha }}

      - name: Generate and apply patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          cd /app
          git diff $BASE_COMMIT HEAD -- ':!.swebench' ':!.github' ':!.devcontainer' ':!.vscode' ':!submit.sh' ':!.gitignore' ':!problem_statement.md' ':!hints_text.md' ':!CLAUDE.md' ':!AGENTS.md' ':!.claudeignore' ':!.copilotignore' ':!.cursorignore' ':!.cursorrules' > /tmp/patch.diff || true
          echo "Patch size: $(wc -c < /tmp/patch.diff) bytes"
          git reset --hard $BASE_COMMIT
          git apply -v /tmp/patch.diff || echo "No code patch to apply"

      - name: Apply Test Patch
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/xarray/tests/test_duck_array_ops.py b/xarray/tests/test_duck_array_ops.py
          --- a/xarray/tests/test_duck_array_ops.py
          +++ b/xarray/tests/test_duck_array_ops.py
          @@ -595,6 +595,24 @@ def test_min_count(dim_num, dtype, dask, func, aggdim):
               assert_dask_array(actual, dask)
           
           
          +@pytest.mark.parametrize("dtype", [float, int, np.float32, np.bool_])
          +@pytest.mark.parametrize("dask", [False, True])
          +@pytest.mark.parametrize("func", ["sum", "prod"])
          +def test_min_count_nd(dtype, dask, func):
          +    if dask and not has_dask:
          +        pytest.skip("requires dask")
          +
          +    min_count = 3
          +    dim_num = 3
          +    da = construct_dataarray(dim_num, dtype, contains_nan=True, dask=dask)
          +    actual = getattr(da, func)(dim=["x", "y", "z"], skipna=True, min_count=min_count)
          +    # Supplying all dims is equivalent to supplying `...` or `None`
          +    expected = getattr(da, func)(dim=..., skipna=True, min_count=min_count)
          +
          +    assert_allclose(actual, expected)
          +    assert_dask_array(actual, dask)
          +
          +
           @pytest.mark.parametrize("func", ["sum", "prod"])
           def test_min_count_dataset(func):
               da = construct_dataarray(2, dtype=float, contains_nan=True, dask=False)
          @@ -606,14 +624,15 @@ def test_min_count_dataset(func):
           
           @pytest.mark.parametrize("dtype", [float, int, np.float32, np.bool_])
           @pytest.mark.parametrize("dask", [False, True])
          +@pytest.mark.parametrize("skipna", [False, True])
           @pytest.mark.parametrize("func", ["sum", "prod"])
          -def test_multiple_dims(dtype, dask, func):
          +def test_multiple_dims(dtype, dask, skipna, func):
               if dask and not has_dask:
                   pytest.skip("requires dask")
               da = construct_dataarray(3, dtype, contains_nan=True, dask=dask)
           
          -    actual = getattr(da, func)(("x", "y"))
          -    expected = getattr(getattr(da, func)("x"), func)("y")
          +    actual = getattr(da, func)(("x", "y"), skipna=skipna)
          +    expected = getattr(getattr(da, func)("x", skipna=skipna), func)("y", skipna=skipna)
               assert_allclose(actual, expected)
           
           
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        working-directory: /app
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          [
            "xarray/tests/test_duck_array_ops.py::test_min_count_nd[sum-False-float]",
            "xarray/tests/test_duck_array_ops.py::test_min_count_nd[sum-False-int]",
            "xarray/tests/test_duck_array_ops.py::test_min_count_nd[sum-False-float32]",
            "xarray/tests/test_duck_array_ops.py::test_min_count_nd[sum-False-bool_]",
            "xarray/tests/test_duck_array_ops.py::test_min_count_nd[prod-False-float]",
            "xarray/tests/test_duck_array_ops.py::test_min_count_nd[prod-False-int]",
            "xarray/tests/test_duck_array_ops.py::test_min_count_nd[prod-False-float32]",
            "xarray/tests/test_duck_array_ops.py::test_min_count_nd[prod-False-bool_]"
