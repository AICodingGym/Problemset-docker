name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "astropy__astropy-7671"
      REPO: "astropy/astropy"
      VERSION: "1.3"
      BASE_COMMIT: "a7141cd90019b62688d507ae056298507678c058"
      ENV_SETUP_COMMIT: "848c8fa21332abd66b44efe3cb48b72377fb32cc"
      TEST_CMD: "pytest -rA -vv -o console_output_style=classic --tb=no"
      TEST_FILES: "astropy/utils/tests/test_introspection.py"
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull or build Docker image
        run: |
          IMAGE="ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest"
          echo "Trying pre-built image: $IMAGE"
          if docker pull "$IMAGE" 2>/dev/null; then
            docker tag "$IMAGE" swebench-test
            echo "Using pre-built image (skipped build)"
          else
            echo "Pre-built image not found, building from scratch..."
            docker build -t swebench-test -f .swebench/Dockerfile .
          fi

      - name: Prepare workspace
        run: |
          git fetch origin $BASE_COMMIT --depth=1
          mkdir -p /tmp/swebench-workspace
          git diff $BASE_COMMIT HEAD -- ':!.swebench' ':!.github' ':!.devcontainer' ':!.vscode' ':!submit.sh' ':!.gitignore' ':!problem_statement.md' ':!hints_text.md' ':!CLAUDE.md' ':!AGENTS.md' ':!.claudeignore' ':!.copilotignore' ':!.cursorignore' ':!.cursorrules' > /tmp/swebench-workspace/patch.diff || true
          echo "Patch size: $(wc -c < /tmp/swebench-workspace/patch.diff) bytes"
          cp .swebench/run_script.sh /tmp/swebench-workspace/run_script.sh
          cp .swebench/parser.py /tmp/swebench-workspace/parser.py
          cp .swebench/entrypoint.sh /tmp/swebench-workspace/entrypoint.sh
          chmod +x /tmp/swebench-workspace/run_script.sh
          chmod +x /tmp/swebench-workspace/entrypoint.sh

      - name: Run tests in Docker
        id: run_tests
        run: |
          set +e
          docker run --rm \
            -v /tmp/swebench-workspace:/workspace \
            swebench-test \
            /workspace/entrypoint.sh
          TEST_EXIT=$?
          echo "TEST_EXIT=$TEST_EXIT" >> "$GITHUB_ENV"
          echo "test_exit=$TEST_EXIT" >> "$GITHUB_OUTPUT"

          echo ''
          echo "===== TEST RESULTS ====="
          if [ -f /tmp/swebench-workspace/output.json ]; then
            cat /tmp/swebench-workspace/output.json
          else
            echo "No parsed output found."
          fi
          echo "========================"
          exit $TEST_EXIT
