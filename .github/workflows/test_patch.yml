name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      INSTANCE_ID: "psf__requests-5414"
      REPO: "psf/requests"
      VERSION: "2.26"
      BASE_COMMIT: "39d0fdd9096f7dceccbc8f82e1eda7dd64717a8e"
      ENV_SETUP_COMMIT: "a1a6a549a0143d9b32717dbe3d75cd543ae5a4f6"
      TEST_CMD: "pytest -rA"
      TEST_FILES: "tests/test_requests.py"
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup and run tests
        shell: bash
        run: |
          set +e
          git config --global --add safe.directory $GITHUB_WORKSPACE

          # Activate conda environment
          source /opt/conda/etc/profile.d/conda.sh
          conda activate testbed

          # Install repo in editable mode (fast — deps already cached in image)
          pip install -e . 2>/dev/null || python setup.py develop 2>/dev/null || true

          # Run FAIL_TO_PASS and PASS_TO_PASS tests
          if [ -f .swebench/run_script.sh ]; then
            chmod +x .swebench/run_script.sh
            bash .swebench/run_script.sh $TEST_FILES
            TEST_EXIT=$?
          else
            pytest -rA $TEST_FILES
            TEST_EXIT=$?
          fi

          echo "TEST_EXIT=$TEST_EXIT" >> "$GITHUB_ENV"
          echo "test_exit=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          exit $TEST_EXIT
