name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      INSTANCE_ID: "sympy__sympy-15017"
      REPO: "sympy/sympy"
      VERSION: "1.2"
      BASE_COMMIT: "6810dee426943c1a2fe85b5002dd0d4cf2246a05"
      ENV_SETUP_COMMIT: "e53e809176de9aa0fb62e85689f8cdb669d4cacb"
      TEST_CMD: "PYTHONWARNINGS='ignore::UserWarning,ignore::SyntaxWarning' bin/test -C --verbose"
      TEST_FILES: "sympy/tensor/array/tests/test_immutable_ndim_array.py"
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup and run tests
        shell: bash
        run: |
          set +e
          git config --global --add safe.directory $GITHUB_WORKSPACE

          # Activate conda environment
          source /opt/conda/etc/profile.d/conda.sh
          conda activate testbed

          # Install repo in editable mode (fast — deps already cached in image)
          pip install -e . 2>/dev/null || python setup.py develop 2>/dev/null || true

          # Run FAIL_TO_PASS and PASS_TO_PASS tests
          if [ -f .swebench/run_script.sh ]; then
            chmod +x .swebench/run_script.sh
            bash .swebench/run_script.sh $TEST_FILES
            TEST_EXIT=$?
          else
            PYTHONWARNINGS='ignore::UserWarning,ignore::SyntaxWarning' bin/test -C --verbose $TEST_FILES
            TEST_EXIT=$?
          fi

          echo "TEST_EXIT=$TEST_EXIT" >> "$GITHUB_ENV"
          echo "test_exit=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          exit $TEST_EXIT
