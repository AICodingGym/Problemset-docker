name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/aicodinggym/problemset-docker/${{ github.ref_name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      INSTANCE_ID: "matplotlib__matplotlib-24570"
      REPO: "matplotlib/matplotlib"
      VERSION: "3.6"
      BASE_COMMIT: "8f0003ae902952372824c9917975fb372c026a42"
      ENV_SETUP_COMMIT: "73909bcb408886a22e2b84581d6b9e6d9907c813"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'lib/matplotlib/tests/test_offsetbox.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            build/
            **/*.so
          key: build-${{ hashFiles('**/*.pyx', '**/*.c', '**/*.h') }}
          restore-keys: build-

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          sudo apt-get -y update && sudo apt-get -y upgrade && DEBIAN_FRONTEND=noninteractive sudo apt-get install -y imagemagick ffmpeg texlive texlive-latex-extra texlive-fonts-recommended texlive-xetex texlive-luatex cm-super dvipng
          QHULL_URL="http://www.qhull.org/download/qhull-2020-src-8.0.2.tgz"
          QHULL_TAR="/tmp/qhull-2020-src-8.0.2.tgz"
          QHULL_BUILD_DIR="$GITHUB_WORKSPACE/build"
          wget -O "$QHULL_TAR" "$QHULL_URL"
          mkdir -p "$QHULL_BUILD_DIR"
          tar -xvzf "$QHULL_TAR" -C "$QHULL_BUILD_DIR"
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/lib/matplotlib/tests/test_offsetbox.py b/lib/matplotlib/tests/test_offsetbox.py
          --- a/lib/matplotlib/tests/test_offsetbox.py
          +++ b/lib/matplotlib/tests/test_offsetbox.py
          @@ -13,7 +13,7 @@
           
           from matplotlib.offsetbox import (
               AnchoredOffsetbox, AnnotationBbox, AnchoredText, DrawingArea, OffsetBox,
          -    OffsetImage, TextArea, _get_packed_offsets)
          +    OffsetImage, TextArea, _get_packed_offsets, HPacker, VPacker)
           
           
           @image_comparison(['offsetbox_clipping'], remove_text=True)
          @@ -335,3 +335,46 @@ def test_arrowprops_copied():
                                   arrowprops=arrowprops)
               assert ab.arrowprops is not ab
               assert arrowprops["relpos"] == (.3, .7)
          +
          +
          +@pytest.mark.parametrize("align", ["baseline", "bottom", "top",
          +                                   "left", "right", "center"])
          +def test_packers(align):
          +    # set the DPI to match points to make the math easier below
          +    fig = plt.figure(dpi=72)
          +    x1, y1 = 10, 30
          +    x2, y2 = 20, 60
          +    r1 = DrawingArea(x1, y1)
          +    r2 = DrawingArea(x2, y2)
          +
          +    hpacker = HPacker(children=[r1, r2], pad=0, sep=0, align=align)
          +    vpacker = VPacker(children=[r1, r2], pad=0, sep=0, align=align)
          +    renderer = fig.canvas.get_renderer()
          +
          +    # HPacker
          +    *extents, offset_pairs = hpacker.get_extent_offsets(renderer)
          +    # width, height, xdescent, ydescent
          +    assert_allclose((x1 + x2, max(y1, y2), 0, 0), extents)
          +    # internal element placement
          +    if align in ("baseline", "left", "bottom"):
          +        y_height = 0
          +    elif align in ("right", "top"):
          +        y_height = y2 - y1
          +    elif align == "center":
          +        y_height = (y2 - y1) / 2
          +    # x-offsets, y-offsets
          +    assert_allclose([(0, y_height), (x1, 0)], offset_pairs)
          +
          +    # VPacker
          +    *extents, offset_pairs = vpacker.get_extent_offsets(renderer)
          +    # width, height, xdescent, ydescent
          +    assert_allclose([max(x1, x2), y1 + y2, 0, max(y1, y2)], extents)
          +    # internal element placement
          +    if align in ("baseline", "left", "bottom"):
          +        x_height = 0
          +    elif align in ("right", "top"):
          +        x_height = x2 - x1
          +    elif align == "center":
          +        x_height = (x2 - x1) / 2
          +    # x-offsets, y-offsets
          +    assert_allclose([(x_height, 0), (0, -y2)], offset_pairs)
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          [
            "lib/matplotlib/tests/test_offsetbox.py::test_packers[bottom]",
            "lib/matplotlib/tests/test_offsetbox.py::test_packers[top]"
